<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Языковой паспорт — Японский, Украинский, Турецкий</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#B23A2E">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EEEAE2;
    --paper-dark:#E2DCCE;
    --ink:#23262B;
    --ink-soft:#63605A;
    --jp:#B23A2E;
    --jp-soft:#F0DAD6;
    --uk:#3B5BA5;
    --uk-gold:#D9A63E;
    --uk-soft:#DCE3F1;
    --tr:#1E7F79;
    --tr-soft:#D9EAE8;
    --line: rgba(35,38,43,0.14);
    --shadow: 0 2px 0 rgba(35,38,43,0.06), 0 10px 24px rgba(35,38,43,0.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0; height:100%;}
  body{
    background:var(--paper);
    background-image: radial-gradient(circle at 1px 1px, rgba(35,38,43,0.035) 1px, transparent 0);
    background-size: 22px 22px;
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .app{ max-width:680px; margin:0 auto; min-height:100vh; padding:18px 16px calc(100px + env(safe-area-inset-bottom)); }
  .stripe{ height:5px; border-radius:3px; display:flex; overflow:hidden; margin-bottom:18px; }
  .stripe span{flex:1;}
  .stripe .s-jp{background:var(--jp);}
  .stripe .s-uk{background:var(--uk);}
  .stripe .s-tr{background:var(--tr);}

  header{margin-bottom:14px;}
  h1{ font-family:'Fraunces',serif; font-weight:700; font-size:26px; margin:0 0 2px; letter-spacing:-0.01em; }
  h1 .accent{color:var(--jp);}
  .subtitle{ font-size:13.5px; color:var(--ink-soft); margin:0; }

  nav.tabs{ display:flex; gap:4px; margin:18px 0 14px; background:var(--paper-dark); padding:5px; border-radius:14px; overflow-x:auto; }
  nav.tabs button{ flex:1; white-space:nowrap; border:none; background:transparent; padding:10px 6px; font-family:'Inter',sans-serif; font-weight:600; font-size:12.5px; color:var(--ink-soft); border-radius:10px; cursor:pointer; transition:all .15s ease; }
  nav.tabs button.active{ background:var(--ink); color:var(--paper); box-shadow:var(--shadow); }

  nav.subtabs{ display:flex; gap:6px; margin-bottom:16px; overflow-x:auto; padding-bottom:4px; }
  nav.subtabs button{ flex:0 0 auto; border:1.5px solid var(--line); background:#fff; padding:8px 14px; font-weight:600; font-size:12.5px; border-radius:999px; cursor:pointer; color:var(--ink-soft); }
  nav.subtabs button.active{ background:var(--ink); color:var(--paper); border-color:var(--ink); }

  .progress-row{ display:flex; justify-content:space-between; align-items:center; font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--ink-soft); margin-bottom:10px; text-transform:uppercase; letter-spacing:.04em; }
  .progress-track{ height:5px; background:var(--paper-dark); border-radius:3px; overflow:hidden; margin-bottom:16px; }
  .progress-fill{ height:100%; background:var(--jp); border-radius:3px; transition:width .3s ease; }

  .card-wrap{ margin-bottom:18px; }
  .card{ position:relative; background:#fff; border:1px solid var(--line); border-radius:22px; box-shadow:var(--shadow); padding:34px 26px 26px; min-height:300px; display:flex; flex-direction:column; cursor:pointer; }
  .stamp-count{ position:absolute; top:16px; right:18px; font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-soft); border:1.5px dashed var(--line); border-radius:999px; padding:3px 10px; }
  .cat-label{ font-family:'IBM Plex Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--jp); margin-bottom:10px; }
  .jp-block{text-align:center; margin:auto 0;}
  .jp-kanji{ font-family:'Fraunces',serif; font-size:54px; font-weight:600; line-height:1.1; }
  .jp-kana{font-size:19px; color:var(--ink-soft); margin-top:4px;}
  .jp-romaji{ font-family:'IBM Plex Mono',monospace; font-size:13px; color:var(--ink-soft); margin-top:6px; letter-spacing:.02em; }
  .flip-hint{ text-align:center; font-size:12px; color:var(--ink-soft); margin-top:14px; }
  .speak-btn{ display:inline-flex; align-items:center; justify-content:center; width:30px;height:30px; border-radius:50%; border:1.5px solid var(--line); background:var(--paper); color:var(--ink); cursor:pointer; font-size:13px; margin-top:10px; }
  .speak-btn:hover{background:var(--paper-dark);}

  .back-block{ border-radius:14px; padding:14px 16px; margin-bottom:10px; }
  .back-block.uk{background:var(--uk-soft);}
  .back-block.tr{background:var(--tr-soft);}
  .back-label{ font-family:'IBM Plex Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:.05em; display:flex; align-items:center; gap:6px; margin-bottom:4px; }
  .back-block.uk .back-label{color:var(--uk);}
  .back-block.tr .back-label{color:var(--tr);}
  .back-word{font-family:'Fraunces',serif; font-weight:600; font-size:22px;}
  .back-example{font-size:13px; color:var(--ink-soft); margin-top:4px; font-style:italic;}

  .rate-row{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:6px; }
  .rate-row button{ border:none; border-radius:12px; padding:12px 4px; font-family:'Inter',sans-serif; font-weight:700; font-size:12.5px; cursor:pointer; color:#fff; transform:rotate(-1deg); transition:transform .12s ease; }
  .rate-row button:hover{transform:rotate(0deg) scale(1.03);}
  .r-again{background:#8B8478;}
  .r-hard{background:var(--uk-gold);}
  .r-good{background:var(--tr);}
  .r-easy{background:var(--jp);}

  .empty-state{ text-align:center; padding:60px 20px; color:var(--ink-soft); }
  .empty-state .big{font-size:40px; margin-bottom:10px;}

  .quiz-prompt{ text-align:center; padding:20px; }
  .quiz-tag{ font-family:'IBM Plex Mono',monospace; font-size:11px; text-transform:uppercase; color:var(--ink-soft); margin-bottom:8px; }
  .quiz-word{ font-family:'Fraunces',serif; font-size:34px; font-weight:600; }
  .quiz-options{ display:flex; flex-direction:column; gap:10px; margin-top:20px; }
  .quiz-options button{ text-align:left; padding:14px 16px; border-radius:14px; border:1.5px solid var(--line); background:#fff; font-family:'Inter',sans-serif; font-size:15px; cursor:pointer; transition:all .12s ease; }
  .quiz-options button:hover{border-color:var(--ink);}
  .quiz-options button.correct{background:var(--tr-soft); border-color:var(--tr);}
  .quiz-options button.wrong{background:var(--jp-soft); border-color:var(--jp);}
  .quiz-score{ font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--ink-soft); text-align:center; margin-top:16px; }
  .next-btn{ display:block; margin:16px auto 0; background:var(--ink); color:var(--paper); border:none; padding:12px 26px; border-radius:12px; font-weight:700; cursor:pointer; }

  .stats-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:16px; }
  .stat-box{ background:#fff; border:1px solid var(--line); border-radius:16px; padding:18px; box-shadow:var(--shadow); }
  .stat-num{ font-family:'Fraunces',serif; font-size:32px; font-weight:700; }
  .stat-label{ font-size:12px; color:var(--ink-soft); margin-top:2px; }
  .cat-bars{background:#fff; border:1px solid var(--line); border-radius:16px; padding:18px; box-shadow:var(--shadow);}
  .cat-bar-row{margin-bottom:12px;}
  .cat-bar-row:last-child{margin-bottom:0;}
  .cat-bar-label{display:flex; justify-content:space-between; font-size:12.5px; margin-bottom:4px; color:var(--ink-soft);}
  .cat-bar-track{height:7px; background:var(--paper-dark); border-radius:4px; overflow:hidden;}
  .cat-bar-fill{height:100%; border-radius:4px;}

  /* alphabet grid */
  .alpha-intro{ font-size:13px; color:var(--ink-soft); margin-bottom:14px; line-height:1.5; }
  .alpha-group-title{ font-family:'IBM Plex Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); margin:18px 0 8px; }
  .alpha-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(84px,1fr)); gap:8px; }
  .alpha-tile{ background:#fff; border:1px solid var(--line); border-radius:14px; padding:10px 6px 8px; text-align:center; cursor:pointer; transition:transform .1s ease, box-shadow .1s ease; }
  .alpha-tile:hover{ box-shadow:var(--shadow); transform:translateY(-1px); }
  .alpha-ch{ font-family:'Fraunces',serif; font-size:24px; font-weight:600; line-height:1.1; }
  .alpha-ch.jp-font{ font-size:26px; }
  .alpha-pron{ font-size:11px; color:var(--ink-soft); margin-top:4px; font-family:'IBM Plex Mono',monospace; }
  .alpha-note{ font-size:9.5px; color:var(--jp); margin-top:2px; }
  .kanji-tile{ min-height:96px; display:flex; flex-direction:column; justify-content:center; }
  .kanji-mean{ font-size:10.5px; color:var(--ink); margin-top:3px; }

  .stamp-pop{ position:fixed; top:50%;left:50%; transform:translate(-50%,-50%) scale(0) rotate(-18deg); width:130px;height:130px; border:5px solid var(--jp); border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:'Fraunces',serif; font-weight:700; font-size:20px; color:var(--jp); background:rgba(255,255,255,0.9); pointer-events:none; z-index:50; opacity:0; }
  @keyframes stampIn{
    0%{transform:translate(-50%,-50%) scale(2.4) rotate(-18deg); opacity:0;}
    40%{transform:translate(-50%,-50%) scale(0.95) rotate(-18deg); opacity:1;}
    60%{transform:translate(-50%,-50%) scale(1.05) rotate(-18deg); opacity:1;}
    100%{transform:translate(-50%,-50%) scale(1) rotate(-18deg); opacity:0;}
  }
  .stamp-pop.play{animation:stampIn .7s ease forwards;}

  .install-banner{ display:flex; align-items:center; justify-content:space-between; gap:10px; background:var(--ink); color:var(--paper); border-radius:14px; padding:12px 16px; margin-bottom:16px; font-size:13px; }
  .install-banner button{ background:var(--jp); color:#fff; border:none; padding:8px 14px; border-radius:10px; font-weight:700; cursor:pointer; font-size:12.5px; white-space:nowrap; }

  footer.note{ text-align:center; font-size:11.5px; color:var(--ink-soft); margin-top:22px; }
</style>
</head>

<script>
/* ================= PWA install prompt ================= */
let deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredInstallPrompt = e;
  render();
});
if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
function doInstall(){
  if(!deferredInstallPrompt) return;
  deferredInstallPrompt.prompt();
  deferredInstallPrompt.userChoice.finally(()=>{ deferredInstallPrompt = null; render(); });
}

  ['ば','ba','ба','daku'],['び','bi','би','daku'],['ぶ','bu','бу','daku'],['べ','be','бэ','daku'],['ぼ','bo','бо','daku'],
  ['ぱ','pa','па','handaku'],['ぴ','pi','пи','handaku'],['ぷ','pu','пу','handaku'],['ぺ','pe','пэ','handaku'],['ぽ','po','по','handaku'],
];
const KATAKANA = [
  ['ア','a','а','base'],['イ','i','и','base'],['ウ','u','у','base'],['エ','e','э','base'],['オ','o','о','base'],
  ['カ','ka','ка','base'],['キ','ki','ки','base'],['ク','ku','ку','base'],['ケ','ke','кэ','base'],['コ','ko','ко','base'],
  ['サ','sa','са','base'],['シ','shi','си','base'],['ス','su','су','base'],['セ','se','сэ','base'],['ソ','so','со','base'],
  ['タ','ta','та','base'],['チ','chi','ти','base'],['ツ','tsu','цу','base'],['テ','te','тэ','base'],['ト','to','то','base'],
  ['ナ','na','на','base'],['ニ','ni','ни','base'],['ヌ','nu','ну','base'],['ネ','ne','нэ','base'],['ノ','no','но','base'],
  ['ハ','ha','ха','base'],['ヒ','hi','хи','base'],['フ','fu','фу','base'],['ヘ','he','хэ','base'],['ホ','ho','хо','base'],
  ['マ','ma','ма','base'],['ミ','mi','ми','base'],['ム','mu','му','base'],['メ','me','мэ','base'],['モ','mo','мо','base'],
  ['ヤ','ya','я','base'],['ユ','yu','ю','base'],['ヨ','yo','ё','base'],
  ['ラ','ra','ра','base'],['リ','ri','ри','base'],['ル','ru','ру','base'],['レ','re','рэ','base'],['ロ','ro','ро','base'],
  ['ワ','wa','ва','base'],['ヲ','wo','о (частица)','base'],['ン','n','н','base'],
  ['ガ','ga','га','daku'],['ギ','gi','ги','daku'],['グ','gu','гу','daku'],['ゲ','ge','гэ','daku'],['ゴ','go','го','daku'],
  ['ザ','za','дза','daku'],['ジ','ji','дзи','daku'],['ズ','zu','дзу','daku'],['ゼ','ze','дзэ','daku'],['ゾ','zo','дзо','daku'],
  ['ダ','da','да','daku'],['ヂ','ji','дзи','daku'],['ヅ','zu','дзу','daku'],['デ','de','дэ','daku'],['ド','do','до','daku'],
  ['バ','ba','ба','daku'],['ビ','bi','би','daku'],['ブ','bu','бу','daku'],['ベ','be','бэ','daku'],['ボ','bo','бо','daku'],
  ['パ','pa','па','handaku'],['ピ','pi','пи','handaku'],['プ','pu','пу','handaku'],['ペ','pe','пэ','handaku'],['ポ','po','по','handaku'],
];
// kanji: [char, readings, meaning]
const KANJI = [
  ['一','ити','один'],['二','ни','два'],['三','сан','три'],['四','ён / си','четыре'],['五','го','пять'],
  ['六','року','шесть'],['七','нана / сити','семь'],['八','хати','восемь'],['九','кю: / ку','девять'],['十','дзю:','десять'],
  ['人','хито / дзин','человек'],['日','хи / нити','день, солнце'],['月','цуки / гэцу','месяц, луна'],['火','хи / ка','огонь'],['水','мидзу / суй','вода'],
  ['木','ки / моку','дерево'],['金','канэ / кин','золото, деньги'],['土','цути / до','земля'],['大','оо: / дай','большой'],['小','тии / сё:','маленький'],
  ['中','нака / тю:','середина']
];

/* ================= STATE ================= */
let srs = {};
let stats = {streak:0,lastActive:null,totalReviews:0,quizAttempts:0,quizCorrect:0};
let view = 'alphabet';
let alphaSub = 'tr';
let flipped = false;
let currentCard = null;
let quizState = null;
let storageReady = false;
const DAY = 24*60*60*1000;

async function loadState(){
  try{ const s = await window.storage.get('srs-state'); if(s && s.value) srs = JSON.parse(s.value); }catch(e){ srs = {}; }
  try{ const st = await window.storage.get('stats'); if(st && st.value) stats = JSON.parse(st.value); }catch(e){}
  storageReady = true;
  touchStreak();
  pickLearnCard();
  render();
}
async function saveSrs(){ try{ await window.storage.set('srs-state', JSON.stringify(srs)); }catch(e){} }
async function saveStats(){ try{ await window.storage.set('stats', JSON.stringify(stats)); }catch(e){} }
function todayStr(){ return new Date().toDateString(); }
function touchStreak(){
  const today = todayStr();
  if(stats.lastActive === today) return;
  const y = new Date(Date.now()-DAY).toDateString();
  stats.streak = (stats.lastActive === y) ? stats.streak+1 : 1;
  stats.lastActive = today;
  saveStats();
}
function stateFor(id){ return srs[id] || {interval: DAY, ease:2.5, due: Date.now(), reps:0}; }
function dueCards(){ const now = Date.now(); return CARDS.filter(c => stateFor(c.id).due <= now); }
function pickLearnCard(){ const due = dueCards(); currentCard = due.length ? due[0] : null; flipped = false; }

function rate(quality){
  if(!currentCard) return;
  const s = stateFor(currentCard.id);
  let {interval, ease, reps} = s;
  if(quality==='again'){ interval = 10*60*1000; ease = Math.max(1.3, ease-0.2); reps=0; }
  else if(quality==='hard'){ interval = interval*1.2; ease = Math.max(1.3, ease-0.05); reps+=1; }
  else if(quality==='good'){ interval = (reps===0? DAY: interval*ease); ease += 0.02; reps+=1; }
  else if(quality==='easy'){ interval = (reps===0? 3*DAY: interval*ease*1.3); ease += 0.15; reps+=1; }
  srs[currentCard.id] = {interval, ease, due: Date.now()+interval, reps};
  stats.totalReviews += 1;
  saveSrs(); saveStats();
  playStamp();
  setTimeout(()=>{ pickLearnCard(); render(); }, 480);
}
function playStamp(){ const pop = document.getElementById('stampPop'); if(!pop) return; pop.classList.remove('play'); void pop.offsetWidth; pop.classList.add('play'); }
function speak(text, lang){
  try{
    if(!window.speechSynthesis) return;
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
function newQuiz(){
  const langs = ['jp','uk','tr'];
  const from = langs[Math.floor(Math.random()*3)];
  let to = langs[Math.floor(Math.random()*3)];
  while(to===from) to = langs[Math.floor(Math.random()*3)];
  const card = CARDS[Math.floor(Math.random()*CARDS.length)];
  const correctVal = to==='jp' ? card.jp.k : card[to];
  let pool = CARDS.filter(c=>c.id!==card.id).sort(()=>0.5-Math.random()).slice(0,3);
  const options = pool.map(c => to==='jp'? c.jp.k : c[to]);
  options.push(correctVal);
  options.sort(()=>0.5-Math.random());
  quizState = { card, from, to, promptVal: from==='jp'? card.jp.k : card[from], options, correctVal, answered:false };
}
function answerQuiz(val){
  if(quizState.answered) return;
  quizState.answered = true;
  quizState.picked = val;
  stats.quizAttempts += 1;
  if(val === quizState.correctVal) stats.quizCorrect += 1;
  saveStats();
  render();
}
function langLabel(l){ return l==='jp'?'🇯🇵 Японский':l==='uk'?'🇺🇦 Украинский':'🇹🇷 Турецкий'; }

/* ================= RENDER ================= */
function render(){
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="stripe"><span class="s-jp"></span><span class="s-uk"></span><span class="s-tr"></span></div>
    ${deferredInstallPrompt ? `<div class="install-banner"><span>Установить приложение на устройство?</span><button onclick="doInstall()">Установить</button></div>` : ''}
    <header>
      <h1>Языковой <span class="accent">паспорт</span></h1>
      <p class="subtitle">Японский — главная цель. Украинский и турецкий — попутно, через те же карточки.</p>
    </header>
    <nav class="tabs">
      <button class="${view==='alphabet'?'active':''}" onclick="setView('alphabet')">Алфавит</button>
      <button class="${view==='learn'?'active':''}" onclick="setView('learn')">Учить</button>
      <button class="${view==='quiz'?'active':''}" onclick="setView('quiz')">Квиз</button>
      <button class="${view==='stats'?'active':''}" onclick="setView('stats')">Статистика</button>
    </nav>
    <div id="content"></div>
    <div class="stamp-pop" id="stampPop">合格</div>
    <footer class="note">Прогресс сохраняется локально на этом устройстве.</footer>
  `;
  const content = document.getElementById('content');
  if(view==='alphabet') content.innerHTML = renderAlphabet();
  else if(view==='learn') content.innerHTML = renderLearn();
  else if(view==='quiz') content.innerHTML = renderQuiz();
  else content.innerHTML = renderStats();
}

function renderAlphabet(){
  const subs = [
    ['tr','Турецкий'],['uk','Украинский'],['hira','Хирагана'],['kata','Катакана'],['kanji','Кандзи']
  ];
  const subNav = subs.map(([id,label])=>`<button class="${alphaSub===id?'active':''}" onclick="setAlphaSub('${id}')">${label}</button>`).join('');

  let body = '';
  if(alphaSub==='tr'){
    body = `<p class="alpha-intro">29 букв. Произношение дано приблизительной русской транскрипцией — нажми на плитку, чтобы услышать звук.</p>
      <div class="alpha-grid">${TURKISH.map(([ch,pron])=>tile(ch,pron,'tr-TR',ch.split(' ')[0])).join('')}</div>`;
  } else if(alphaSub==='uk'){
    body = `<p class="alpha-intro">33 буквы. Многие похожи на русские — обрати внимание на г/ґ, и/і, е/є.</p>
      <div class="alpha-grid">${UKRAINIAN.map(([ch,pron])=>tile(ch,pron,'uk-UA',ch.split(' ')[0])).join('')}</div>`;
  } else if(alphaSub==='hira'){
    body = `<p class="alpha-intro">Хирагана — базовая японская азбука, используется для грамматики и родных слов. Транскрипция дана по системе Поливанова.</p>
      ${kanaGroup(HIRAGANA,'base','Основные знаки (годзюон)')}
      ${kanaGroup(HIRAGANA,'daku','Звонкие (дакутэн)')}
      ${kanaGroup(HIRAGANA,'handaku','Полузвонкие (хандакутэн)')}`;
  } else if(alphaSub==='kata'){
    body = `<p class="alpha-intro">Катакана — азбука для иностранных слов и имён. Звучит так же, как хирагана, но пишется иначе.</p>
      ${kanaGroup(KATAKANA,'base','Основные знаки (годзюон)')}
      ${kanaGroup(KATAKANA,'daku','Звонкие (дакутэн)')}
      ${kanaGroup(KATAKANA,'handaku','Полузвонкие (хандакутэн)')}`;
  } else if(alphaSub==='kanji'){
    body = `<p class="alpha-intro">Иероглифы (кандзи) для старта: числа и базовые понятия. У каждого кандзи обычно два типа чтений — онъёми и кунъёми.</p>
      <div class="alpha-grid">${KANJI.map(([ch,read,mean])=>`
        <div class="alpha-tile kanji-tile" onclick="speak('${ch}','ja-JP')">
          <div class="alpha-ch jp-font">${ch}</div>
          <div class="alpha-pron">${read}</div>
          <div class="kanji-mean">${mean}</div>
        </div>`).join('')}</div>`;
  }
  return `<nav class="subtabs">${subNav}</nav>${body}`;
}
function tile(ch, pron, lang, speakCh){
  return `<div class="alpha-tile" onclick="speak('${speakCh}','${lang}')">
    <div class="alpha-ch">${ch}</div>
    <div class="alpha-pron">${pron}</div>
  </div>`;
}
function kanaGroup(list, group, title){
  const items = list.filter(x=>x[3]===group);
  return `<div class="alpha-group-title">${title}</div>
    <div class="alpha-grid">${items.map(([kana,romaji,pron])=>`
      <div class="alpha-tile jp-font" onclick="speak('${kana}','ja-JP')">
        <div class="alpha-ch jp-font">${kana}</div>
        <div class="alpha-pron">${pron} <span style="opacity:.6">(${romaji})</span></div>
      </div>`).join('')}</div>`;
}

function renderLearn(){
  const due = dueCards();
  const total = CARDS.length;
  const learnedToday = Math.max(0, total - due.length);
  const pct = Math.round((learnedToday/total)*100);
  if(!currentCard){
    return `
      <div class="progress-row"><span>Готово на сегодня</span><span>${learnedToday}/${total}</span></div>
      <div class="progress-track"><div class="progress-fill" style="width:100%"></div></div>
      <div class="empty-state">
        <div class="big">🈴</div>
        <p>Все карточки повторены на сегодня.<br>Возвращайся позже — или попробуй Квиз.</p>
      </div>
    `;
  }
  const c = currentCard;
  const st = stateFor(c.id);
  const catColor = CAT_COLORS[c.cat] || 'var(--ink)';
  let inner;
  if(!flipped){
    inner = `
      <div class="cat-label" style="color:${catColor}">${c.cat}</div>
      <div class="jp-block">
        <div class="jp-kanji">${c.jp.k}</div>
        <div class="jp-kana">${c.jp.kana}</div>
        <div class="jp-romaji">${c.jp.r}</div>
        <button class="speak-btn" onclick="event.stopPropagation(); speak('${c.jp.k.replace(/'/g,"\\'")}','ja-JP')">🔊</button>
      </div>
      <div class="flip-hint">Нажми на карточку, чтобы увидеть перевод →</div>
    `;
  } else {
    inner = `
      <div class="cat-label" style="color:${catColor}">${c.cat}</div>
      <div class="jp-block" style="margin-bottom:14px;">
        <div class="jp-kanji" style="font-size:34px;">${c.jp.k}</div>
        <div class="jp-romaji">${c.jp.r}</div>
      </div>
      <div class="back-block uk">
        <div class="back-label">${langLabel('uk')} <button class="speak-btn" style="width:22px;height:22px;font-size:10px;" onclick="event.stopPropagation(); speak('${c.uk.replace(/'/g,"\\'")}','uk-UA')">🔊</button></div>
        <div class="back-word">${c.uk}</div>
        <div class="back-example">${c.ex.uk}</div>
      </div>
      <div class="back-block tr">
        <div class="back-label">${langLabel('tr')} <button class="speak-btn" style="width:22px;height:22px;font-size:10px;" onclick="event.stopPropagation(); speak('${c.tr.replace(/'/g,"\\'")}','tr-TR')">🔊</button></div>
        <div class="back-word">${c.tr}</div>
        <div class="back-example">${c.ex.tr}</div>
      </div>
      <div class="rate-row">
        <button class="r-again" onclick="event.stopPropagation(); rate('again')">Ещё раз</button>
        <button class="r-hard" onclick="event.stopPropagation(); rate('hard')">Трудно</button>
        <button class="r-good" onclick="event.stopPropagation(); rate('good')">Хорошо</button>
        <button class="r-easy" onclick="event.stopPropagation(); rate('easy')">Легко</button>
      </div>
    `;
  }
  return `
    <div class="progress-row"><span>Сегодня</span><span>${learnedToday}/${total} · осталось ${due.length}</span></div>
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="card-wrap">
      <div class="card" onclick="toggleFlip()">
        <div class="stamp-count">${st.reps} повт.</div>
        ${inner}
      </div>
    </div>
  `;
}

function renderQuiz(){
  if(!quizState) newQuiz();
  const q = quizState;
  const acc = stats.quizAttempts ? Math.round(100*stats.quizCorrect/stats.quizAttempts) : 0;
  const optsHtml = q.options.map(opt=>{
    let cls = '';
    if(q.answered){ if(opt===q.correctVal) cls='correct'; else if(opt===q.picked) cls='wrong'; }
    return `<button class="${cls}" onclick="answerQuiz('${opt.replace(/'/g,"\\'")}')">${opt}</button>`;
  }).join('');
  return `
    <div class="quiz-prompt">
      <div class="quiz-tag">${langLabel(q.from)} → ${langLabel(q.to)}</div>
      <div class="quiz-word">${q.promptVal}</div>
      <div class="quiz-options">${optsHtml}</div>
      ${q.answered ? `<button class="next-btn" onclick="newQuiz(); render();">Далее →</button>` : ''}
    </div>
    <div class="quiz-score">Правильно: ${stats.quizCorrect}/${stats.quizAttempts} (${acc}%)</div>
  `;
}

function renderStats(){
  const total = CARDS.length;
  const learned = CARDS.filter(c=>stateFor(c.id).reps>0).length;
  const cats = [...new Set(CARDS.map(c=>c.cat))];
  const catRows = cats.map(cat=>{
    const catCards = CARDS.filter(c=>c.cat===cat);
    const done = catCards.filter(c=>stateFor(c.id).reps>0).length;
    const pct = Math.round(100*done/catCards.length);
    const color = CAT_COLORS[cat] || 'var(--ink)';
    return `
      <div class="cat-bar-row">
        <div class="cat-bar-label"><span>${cat}</span><span>${done}/${catCards.length}</span></div>
        <div class="cat-bar-track"><div class="cat-bar-fill" style="width:${pct}%; background:${color};"></div></div>
      </div>
    `;
  }).join('');
  return `
    <div class="stats-grid">
      <div class="stat-box"><div class="stat-num">${stats.streak}</div><div class="stat-label">дней подряд</div></div>
      <div class="stat-box"><div class="stat-num">${learned}/${total}</div><div class="stat-label">карточек изучено</div></div>
      <div class="stat-box"><div class="stat-num">${stats.totalReviews}</div><div class="stat-label">повторений всего</div></div>
      <div class="stat-box"><div class="stat-num">${stats.quizAttempts? Math.round(100*stats.quizCorrect/stats.quizAttempts):0}%</div><div class="stat-label">точность квиза</div></div>
    </div>
    <div class="cat-bars">${catRows}</div>
  `;
}

function toggleFlip(){ flipped = !flipped; render(); }
function setView(v){ view=v; if(v==='learn') pickLearnCard(); if(v==='quiz') newQuiz(); render(); }
function setAlphaSub(s){ alphaSub=s; render(); }

window.rate = rate;
window.speak = speak;
window.answerQuiz = answerQuiz;
window.newQuiz = newQuiz;
window.toggleFlip = toggleFlip;
window.setView = setView;
window.setAlphaSub = setAlphaSub;
window.doInstall = doInstall;

loadState();
</script>
</body>
</html>
